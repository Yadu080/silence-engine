if">SQLite (WAL)</text><text x="413.0" y="320.55" text-anchor="middle" font-size="13" font-weight="400" fill="#5b6675" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">observations · cases · reviews</text><text x="413.0" y="337.55" text-anchor="middle" font-size="13" font-weight="400" fill="#5b6675" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">hash-chained audit log</text><rect x="566" y="270" width="286" height="92" rx="8" fill="#ffffff" stroke="#c26d0c" stroke-width="1.4"/><text x="709.0" y="303.55" text-anchor="middle" font-size="13" font-weight="600" fill="#1d2530" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">Evaluation harness</text><text x="709.0" y="320.55" text-anchor="middle" font-size="13" font-weight="400" fill="#5b6675" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">train/test split · naive baseline</text><text x="709.0" y="337.55" text-anchor="middle" font-size="13" font-weight="400" fill="#5b6675" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">reads the separate label file</text><rect x="278" y="400" width="574" height="66" rx="8" fill="#ffffff" stroke="#3b4656" stroke-width="1.4"/><text x="565.0" y="429.05" text-anchor="middle" font-size="13" font-weight="600" fill="#1d2530" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">REST API  (Flask / gunicorn)</text><text x="565.0" y="446.05" text-anchor="middle" font-size="13" font-weight="400" fill="#5b6675" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">validated inputs · loopback or token for writes · anti-CSRF header</text><rect x="278" y="490" width="574" height="70" rx="8" fill="#ffffff" stroke="#0f8ea1" stroke-width="1.4"/><text x="565.0" y="521.2" text-anchor="middle" font-size="12" font-weight="600" fill="#1d2530" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">Reproducibility check</text><text x="565.0" y="537.2" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6675" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">same seed gives identical dataset and metric hashes on a Mac (little-endian) and s390x (big-endian)</text><path d="M333 224 L333 270" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#a)"/><path d="M550 224 L550 248 L413 248 L413 270" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#a)"/><path d="M413 362 L413 400" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#a)"/><path d="M709 362 L709 400" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#a)"/><rect x="935" y="400" width="150" height="66" rx="8" fill="#ffffff" stroke="#3b4656" stroke-width="1.4"/><text x="1010.0" y="429.05" text-anchor="middle" font-size="13" font-weight="600" fill="#1d2530" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">Analyst&#x27;s browser</text><text x="1010.0" y="446.05" text-anchor="middle" font-size="13" font-weight="400" fill="#5b6675" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">React dashboard</text><path d="M852 433 L935 433" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#a)"/><text x="893" y="424" text-anchor="middle" font-size="11.5" font-weight="600" fill="#5b6675" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">SSH tunnel</text><rect x="935" y="270" width="150" height="100" rx="8" fill="#ffffff" stroke="#6a52d9" stroke-width="1.4"/><text x="1010.0" y="300.2" text-anchor="middle" font-size="12" font-weight="600" fill="#1d2530" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">Human review</text><text x="1010.0" y="316.2" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6675" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">hypothesis, verify,</text><text x="1010.0"