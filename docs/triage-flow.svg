<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 730" width="1280" height="730" role="img" aria-labelledby="t d"><title id="t">SILENCE ENGINE triage decision flow</title><desc id="d">How a detected silence becomes one of four hypotheses: scheduled closure leads to expected variation, otherwise feed health and the size of the decline on trusted days decide.</desc><rect width="1280" height="730" fill="#ffffff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#5b6675"/></marker></defs><text x="640" y="28" text-anchor="middle" font-size="17" font-weight="600" fill="#1d2530" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">From a detected silence to a hypothesis (rules fixed in advance, not learned)</text><rect x="470" y="50" width="320" height="46" rx="8" fill="#ffffff" stroke="#3b4656" stroke-width="1.4"/><text x="630.0" y="69.125" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d2530" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">Episode detected</text><text x="630.0" y="85.625" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5b6675" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">2+ days low, no count, or doubtful count</text><rect x="470" y="126" width="320" height="46" rx="8" fill="#ffffff" stroke="#9aa5b4" stroke-width="1.4"/><text x="630.0" y="153.375" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d2530" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">Closed by schedule on normally-open days?</text><path d="M630 96 L630 126" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#a)"/><path d="M790 149 L870 149" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#a)"/><text x="830" y="141" text-anchor="middle" font-size="11.5" font-weight="600" fill="#5b6675" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">yes</text><rect x="870.0" y="123" width="170" height="52" rx="8" fill="#ffffff" stroke="#7a828c" stroke-width="2.4"/><text x="955.0" y="145.125" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d2530" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">Expected variation</text><text x="955.0" y="161.625" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5b6675" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">scheduled closure</text><rect x="470" y="206" width="320" height="46" rx="8" fill="#ffffff" stroke="#3b4656" stroke-width="1.4"/><text x="630.0" y="233.375" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d2530" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">Feed health over the open days in the window</text><path d="M630 172 L630 206" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#a)"/><text x="644" y="193" text-anchor="middle" font-size="11.5" font-weight="600" fill="#5b6675" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">no</text><rect x="80" y="290" width="220" height="46" rx="8" fill="#ffffff" stroke="#0f8ea1" stroke-width="1.4"/><text x="190.0" y="309.125" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d2530" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">FAILED</text><text x="190.0" y="325.625" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5b6675" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">60%+ of days missing or doubtful</text><rect x="450" y="290" width="220" height="46" rx="8" fill="#ffffff" stroke="#0f8ea1" stroke-width="1.4"/><text x="560.0" y="309.125" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d2530" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">DEGRADED</text><text x="560.0" y="325.625" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5b6675" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">20%+ of days</text><rect x="890" y="290" width="220" height="46" rx="8" fill="#ffffff" stroke="#c26d0c" stroke-width="1.4"/><text x="1000.0" y="309.125" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d2530" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">HEALTHY</text><text x="1000.0" y="325.625" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5b6675" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">under 20% of days</text><path d="M630 252 L630 271" fill="none" stroke="#5b6675" stroke-width="1.5"/><path d="M190 271 L1000 271" fill="none" stroke="#5b6675" stroke-width="1.5"/><path d="M190 271 L190 290" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#a)"/><path d="M560 271 L560 290" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#a)"/><path d="M1000 271 L1000 290" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#a)"/><rect x="80" y="370" width="220" height="54" rx="8" fill="#ffffff" stroke="#9aa5b4" stroke-width="1.4"/><text x="190.0" y="393.125" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d2530" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">Strong decline on</text><text x="190.0" y="409.625" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5b6675" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">2+ trusted days?</text><path d="M190 336 L190 370" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#a)"/><rect x="450" y="370" width="220" height="54" rx="8" fill="#ffffff" stroke="#9aa5b4" stroke-width="1.4"/><text x="560.0" y="393.125" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d2530" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">Strong or moderate</text><text x="560.0" y="409.625" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5b6675" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">decline?</text><path d="M560 336 L560 370" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#a)"/><rect x="890" y="370" width="220" height="54" rx="8" fill="#ffffff" stroke="#9aa5b4" stroke-width="1.4"/><text x="1000.0" y="393.125" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d2530" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">Enough history?</text><text x="1000.0" y="409.625" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5b6675" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">(4+ comparable days)</text><path d="M1000 336 L1000 370" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#a)"/><path d="M130 424 L130 450 L95 450 L95 470" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#a)"/><text x="125" y="443" text-anchor="middle" font-size="11.5" font-weight="600" fill="#5b6675" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">yes</text><rect x="12.5" y="470" width="165" height="52" rx="8" fill="#ffffff" stroke="#6a52d9" stroke-width="2.4"/><text x="95.0" y="492.125" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d2530" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">Uncertain</text><text x="95.0" y="508.625" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5b6675" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">decline and failed feed</text><path d="M250 424 L250 450 L285 450 L285 470" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#a)"/><text x="255" y="443" text-anchor="middle" font-size="11.5" font-weight="600" fill="#5b6675" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">no</text><rect x="202.5" y="470" width="165" height="52" rx="8" fill="#ffffff" stroke="#0f8ea1" stroke-width="2.4"/><text x="285.0" y="492.125" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d2530" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">Likely reporting</text><text x="285.0" y="508.625" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5b6675" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">problem: feed failure</text><path d="M500 424 L500 450 L475 450 L475 470" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#a)"/><text x="505" y="443" text-anchor="middle" font-size="11.5" font-weight="600" fill="#5b6675" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">yes</text><rect x="392.5" y="470" width="165" height="52" rx="8" fill="#ffffff" stroke="#6a52d9" stroke-width="2.4"/><text x="475.0" y="492.125" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d2530" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">Uncertain</text><text x="475.0" y="508.625" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5b6675" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">decline and degraded feed</text><path d="M620 424 L620 450 L665 450 L665 470" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#a)"/><text x="635" y="443" text-anchor="middle" font-size="11.5" font-weight="600" fill="#5b6675" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">no</text><rect x="582.5" y="470" width="165" height="52" rx="8" fill="#ffffff" stroke="#0f8ea1" stroke-width="2.4"/><text x="665.0" y="492.125" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d2530" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">Likely reporting</text><text x="665.0" y="508.625" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5b6675" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">problem: intermittent</text><path d="M1110 397 L1140 397" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#a)"/><text x="1125" y="389" text-anchor="middle" font-size="11.5" font-weight="600" fill="#5b6675" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">no</text><rect x="1140.0" y="371" width="130" height="52" rx="8" fill="#ffffff" stroke="#6a52d9" stroke-width="2.4"/><text x="1205.0" y="393.125" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d2530" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">Uncertain</text><text x="1205.0" y="409.625" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5b6675" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">too little history</text><path d="M1000 424 L1000 470" fill="none" stroke="#5b6675" stroke-width="1.5" marker-end="url(#a)"/><text x="1014" y="452" text-anchor="middle" font-size="11.5" font-weight="600" fill="#5b6675" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">yes</text><rect x="850" y="470" width="300" height="56" rx="8" fill="#ffffff" stroke="#c26d0c" stroke-width="2.4"/><text x="1000.0" y="494.125" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d2530" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">Strong decline (35%+ shortfall, z at most -4)</text><text x="1000.0" y="510.625" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5b6675" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">Potential service-access gap</text><rect x="850" y="542" width="300" height="66" rx="8" fill="#ffffff" stroke="#3b4656" stroke-width="1.4"/><text x="1000.0" y="563.2" text-anchor="middle" font-size="12" font-weight="600" fill="#1d2530" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">Moderate decline</text><text x="1000.0" y="579.2" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6675" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">coinciding weather/transport/outage: access gap</text><text x="1000.0" y="595.2" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6675" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">none: uncertain · common in history: expected</text><rect x="850" y="624" width="300" height="56" rx="8" fill="#ffffff" stroke="#7a828c" stroke-width="2.4"/><text x="1000.0" y="648.125" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1d2530" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">Weak decline, within normal range</text><text x="1000.0" y="664.625" text-anchor="middle" font-size="12.5" font-weight="400" fill="#5b6675" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">Expected variation</text><text x="640" y="712" text-anchor="middle" font-size="12" font-weight="400" fill="#5b6675" font-family="IBM Plex Sans, system-ui, -apple-system, Segoe UI, sans-serif">Amber = potential access gap · teal = likely reporting problem · violet = uncertain · grey = expected variation. Every output is a hypothesis for human verification.</text></svg>